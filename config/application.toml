#:schema ../__pyronaut__/schemas/micronaut-application.schema.json

[micronaut.application]
name = 'pyronaut-full-stack-template'

# ---------------------------------------------------------------------------
# Application settings. Every value here can be overridden by an environment
# variable (APP_SECRET_KEY, APP_FIRST_SUPERUSER, ...) or, in the dev and test
# environments, by a .env file. See src/app/config.py and src/app/dotenv.py.
# ---------------------------------------------------------------------------
[app]
name = 'Pyronaut Full Stack Project'
# HS256 signing requires at least 256 bits of key material, so this placeholder
# is long enough to boot with. It is still a placeholder: AppConfigGuard refuses
# to start outside development while it is unchanged. Generate a real one with
#   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
secret-key = 'changethis-changethis-changethis-changethis'
first-superuser = 'admin@example.com'
first-superuser-password = 'changethis'
frontend-host = 'http://localhost:8080'
emails-from-email = 'info@example.com'
emails-from-name = 'Pyronaut Full Stack Project'
email-reset-token-expire-hours = 48

# SMTP. The defaults point at a local Mailpit:
#   docker run --rm -p 1025:1025 -p 8025:8025 axllent/mailpit
smtp-host = 'localhost'
smtp-port = 1025
smtp-user = ''
smtp-tls = false

# ---------------------------------------------------------------------------
# Server-rendered React. One bundle holds every render root: the `App` page
# tree and the transactional email components.
# ---------------------------------------------------------------------------
[micronaut.views]
folder = '.'

[micronaut.views.react]
server-bundle-path = 'classpath:ssr-components.mjs'
client-bundle-url = '/static/client.js'
# A render with no request is not going to a browser -- an email body is the case here --
# and cannot hydrate, so emitting the bootstrap would only serialise the whole view model
# into the message, reset token included. micronaut-views#1199, fixed in 6.3.0.
hydrate-without-request = false

[micronaut.router.static-resources.default]
enabled = true
mapping = '/static/**'
paths = ['file:static']

# Static assets must be reachable without authentication.
#
# The security filter applies to every route, including static resources, and
# the default is to reject. Without this the hydration bundle answers 401: the
# pages still server-render and look completely correct, but no JavaScript ever
# loads, so nothing hydrates and every form falls back to a native submit.
#
# Curl does not notice — it fetches the HTML and stops. It took a browser test
# fetching /static/client.js to find it.
[[micronaut.security.intercept-url-map]]
pattern = '/static/**'
access = ['isAnonymous()']

# ---------------------------------------------------------------------------
# Security. JWT in an HttpOnly cookie so that server-side rendering can read
# the authenticated user from the request. See PLAN.md section 4.2.
# ---------------------------------------------------------------------------
[micronaut.security]
authentication = 'cookie'

[micronaut.security.token.jwt.signatures.secret.generator]
secret = 'changethis-changethis-changethis-changethis'
jws-algorithm = 'HS256'

[micronaut.security.token.generator.access-token]
expiration = 691200 # 8 days, matching the upstream template

[micronaut.security.token.cookie]
enabled = true
cookie-same-site = 'Lax'
cookie-http-only = true
cookie-path = '/'

[micronaut.security.endpoints.login]
enabled = true
path = '/api/v1/login'

[micronaut.security.endpoints.logout]
enabled = true
path = '/api/v1/logout'
get-allowed = false

# No redirects on login.
#
# With redirects on, Micronaut Security answers a failed login with 303 to
# `/login?error=true`, and any client that follows redirects — including the
# test client and fetch() — sees the rendered login page and a 200, making a
# failed login indistinguishable from a successful one. Off, /api/v1/login
# answers 200 with the session cookie, or 401. The browser decides where to
# navigate next.
[micronaut.security.redirect]
enabled = false
# Still required by configuration validation even when redirects are off.
logout = '/login'

# ---------------------------------------------------------------------------
# Persistence. In development and test the URL, username and password are
# supplied by Micronaut Test Resources, which starts a MySQL container on
# demand. There is no Docker Compose file in this repository.
# ---------------------------------------------------------------------------
[datasources.default]
db-type = 'mysql'
dialect = 'MYSQL'
driver-class-name = 'com.mysql.cj.jdbc.Driver'
schema-generate = 'NONE'

[flyway.datasources.default]
enabled = true
locations = ['classpath:db/migration']

# ---------------------------------------------------------------------------
# Outbound email. Jakarta Mail over SMTP; Mailpit in development.
# ---------------------------------------------------------------------------
# Literal values, not ${app.emails-from-email} placeholders.
#
# While Micronaut Test Resources is active its property resolver wraps every
# lookup, and resolving a placeholder re-enters that resolver, which resolves
# properties of its own, and so on until the stack overflows (or the HTTP call
# to the Test Resources server fails with an IOException, depending on timing).
# Beans created lazily on the first request — which is when the mail beans are
# built — hit this; beans created during startup do not.
#
# Override in deployment with MICRONAUT_EMAIL_FROM_EMAIL / MICRONAUT_EMAIL_FROM_NAME.
[micronaut.email.from]
email = 'info@example.com'
name = 'Pyronaut Full Stack Project'


[micronaut.executors.blocking]
type = 'CACHED'
virtual = false

# ---------------------------------------------------------------------------
# GraalPy context pool.
#
# `micronaut.python.pool.size` is deliberately NOT set. It used to be, because
# the default was `processors * 2` -- around 150 contexts under load on a
# 12-core machine -- and because a service with injected dependencies could not
# be pooled, so every request funnelled into the one context its singleton lived
# in and more contexts only made that worse.
#
# Both are fixed as of Pyronaut 0.0.7 (Core 5.2.10): the default is now
# `processors / 2`, floored at 2 and capped at 8 (micronaut-core#13557 and
# #13578), and the services here are `@ContextPooled`, which is what makes extra
# contexts add concurrency instead of dividing the traffic reaching one of them
# (micronaut-core#13565).
#
# Set it only after measuring. The best size depends on how much Python work a
# request does: on the machine these were taken on, a keyed read was still
# gaining at 12 contexts while a paged read of 20 rows peaked at 6 and had lost a
# third by 12. `micronaut-projects/pyronaut-fastapi-benchmark` has the harness.
# `micronaut.python.pool.warn-wait` logs when a request waits for a context,
# which is the signal that the pool is too small; nothing warns when it is too
# large, so that only shows up as throughput falling when you add contexts.
