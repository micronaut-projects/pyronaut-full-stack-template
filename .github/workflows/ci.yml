name: CI

# Two things about the Pyronaut toolchain shape this file, and both are
# temporary:
#
#   - setup-pyronaut has no release tag yet, so the action is referenced by
#     branch. Move to `@v1` once one exists — a branch reference means a change
#     to the action can break this workflow without anything changing here.
#   - The Pyronaut CLI is not on PyPI. It does not need to be: the action
#     downloads the wheel from the GitHub release of `pyronaut-repository`
#     tagged `v<pyronaut-version>`, and `latest` is the default.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Unit tests, both webpack bundles, and a server-render smoke check over
      # every page and every email. The bundles are not committed, and both
      # `pyronaut dev` and `pyronaut test` need them: without
      # views/ssr-components.mjs every server-rendered route returns 500.
      - name: Build and check the frontend
        run: npm run check

      # Playwright downloads every browser on first use — Chromium, the
      # headless shell, and more after that, around 400 MB in total. Cache it
      # or every run pays for it again.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: playwright-${{ runner.os }}-

      - uses: micronaut-projects/setup-pyronaut@main
        with:
          java-version: '25'
          # Must match the GraalVM that the GraalPy bundled with the CLI was
          # built against. A mismatch does not report itself as a version
          # error: it surfaces as `Unknown operation code 0`, or an NPE
          # creating the GraalPy context.
          graalvm-version: '25.4'
          # `graalpy-version` is deliberately unset, which takes the version the
          # installed CLI bundles — the one half of that pairing worth pinning
          # by hand is the JDK above.
          #
          # `pyronaut-version` is left at its default of `latest`, which takes
          # the wheel from Pyronaut's newest GitHub release. Pin it here if a
          # release ever has to be skipped.
          #
          # The wheel and the launcher bundles both come from those releases,
          # which are public, so the job's own token is enough.
          github-token: ${{ github.token }}

      - run: pyronaut install

      # Compiles the Python and Java sources together, and writes the OpenAPI
      # document as a build artifact.
      - run: pyronaut process

      # Fails the build if the committed TypeScript client has drifted from the
      # compile-time OpenAPI document. Generation needs no running server.
      - name: Check the generated API client is current
        run: |
          npm run generate-client
          git diff --exit-code frontend/src/client \
            || { echo "::error::The generated client is out of date. Run 'npm run generate-client' and commit the result."; exit 1; }

      # The pytest API suite and the Playwright browser suite, in one run.
      # MySQL comes from Test Resources and Mailpit from Testcontainers, both
      # started on demand — there is no Docker Compose file to bring up.
      - run: pyronaut test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: __pyronaut__/reports/tests/
          if-no-files-found: ignore

      # Proves the deployable builds. Native is not attempted: the Pyronaut
      # native launchers carry GraalPy but no GraalJS, and every server-rendered
      # route needs it.
      - run: pyronaut build --jvm --docker
