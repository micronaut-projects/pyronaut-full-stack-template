name: CI

# The Pyronaut CLI is not on PyPI, and does not need to be: setup-pyronaut
# downloads the wheel from the GitHub release of `pyronaut-repository` tagged
# `v<pyronaut-version>`, and `latest` is the default.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `npm run check` is these three in one command, and it is kept apart here
      # on purpose: run as one step, a stall shows only as the whole step
      # hanging until the job timeout, with no way to tell which part stalled.
      # Each one carries its own timeout for the same reason.
      - name: Frontend unit tests
        timeout-minutes: 5
        # --ci so a missing snapshot fails instead of being written, and
        # --forceExit because a handle a test leaves open otherwise keeps the
        # runner waiting after the last assertion has passed.
        run: npx jest --ci --forceExit

      # The bundles are not committed, and both `pyronaut dev` and
      # `pyronaut test` need them: without views/ssr-components.mjs every
      # server-rendered route returns 500.
      - name: Build the bundles
        timeout-minutes: 15
        run: npm run build

      # Renders every page and every email from the built bundle. On Node, so
      # it proves the bundle shape rather than GraalJS compatibility.
      - name: Server-render smoke check
        timeout-minutes: 5
        run: npm run verify:ssr

      # Playwright downloads every browser on first use — Chromium, the
      # headless shell, and more after that, around 400 MB in total. Cache it
      # or every run pays for it again.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: playwright-${{ runner.os }}-

      - uses: micronaut-projects/setup-pyronaut@v1
        with:
          java-version: '25'
          # `graalvm-version` and `graalpy-version` are both left at their
          # defaults on purpose. The GraalVM and the GraalPy have to match, and
          # a mismatch never says so — it surfaces as `Unknown operation code 0`
          # or an NPE creating the GraalPy context. The action's defaults track
          # the pairing the installed CLI was built against, which pinning a
          # version here would quietly break at the next Pyronaut release.
          #
          # `pyronaut-version` is left at its default of `latest`, which takes
          # the wheel from Pyronaut's newest GitHub release. Pin it here if a
          # release ever has to be skipped.
          #
          # The wheel and the launcher bundles both come from those releases,
          # which are public, so the job's own token is enough.
          github-token: ${{ github.token }}

      - run: pyronaut install

      # Compiles the Python and Java sources together, and writes the OpenAPI
      # document as a build artifact.
      - run: pyronaut process

      # Fails the build if the committed TypeScript client has drifted from the
      # compile-time OpenAPI document. Generation needs no running server.
      - name: Check the generated API client is current
        run: |
          npm run generate-client
          git diff --exit-code frontend/src/client \
            || { echo "::error::The generated client is out of date. Run 'npm run generate-client' and commit the result."; exit 1; }

      # The pytest API suite and the Playwright browser suite, in one run.
      # MySQL comes from Test Resources and Mailpit from Testcontainers, both
      # started on demand — there is no Docker Compose file to bring up.
      - run: pyronaut test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: __pyronaut__/reports/tests/
          if-no-files-found: ignore

      # Proves the deployable builds. Native is not attempted: the Pyronaut
      # native launchers carry GraalPy but no GraalJS, and every server-rendered
      # route needs it.
      - run: pyronaut build --jvm --docker
