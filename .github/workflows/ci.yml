name: CI

# NOTE: this workflow has never run. This organisation has no GitHub Actions
# minutes until 1 October 2026, so it is written, reviewed by inspection, and
# validated by running the same command sequence locally. Treat it as
# unverified until it has actually executed on a runner.
#
# It also depends on two things that are not ready yet; see PLAN.md section 12:
#   - micronaut-projects/setup-pyronaut has no v1 tag. Its main branch is an
#     empty commit and the action lives on an unmerged branch, so `@v1` will
#     not resolve. Pin a SHA, or wait for the release.
#   - The pyronaut CLI is not on PyPI, and the action downloads Pyronaut's
#     native launchers from GitHub releases of a private repository, so the
#     default github.token is not sufficient.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Unit tests, both webpack bundles, and a server-render smoke check over
      # every page and every email. The bundles are not committed, and both
      # `pyronaut dev` and `pyronaut test` need them: without
      # views/ssr-components.mjs every server-rendered route returns 500.
      - name: Build and check the frontend
        run: npm run check

      # Playwright downloads every browser on first use — Chromium, the
      # headless shell, and more after that, around 400 MB in total. Cache it
      # or every run pays for it again.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: playwright-${{ runner.os }}-

      - uses: micronaut-projects/setup-pyronaut@v1
        with:
          java-version: '25'
          graalvm-version: '25.3'
          # Required while micronaut-projects/pyronaut is private: the launcher
          # bundles come from its GitHub releases and the default token is
          # scoped to this repository only.
          github-token: ${{ secrets.PYRONAUT_RELEASE_TOKEN || github.token }}

      - run: pyronaut install

      # Compiles the Python and Java sources together, and writes the OpenAPI
      # document as a build artifact.
      - run: pyronaut process

      # Fails the build if the committed TypeScript client has drifted from the
      # compile-time OpenAPI document. Generation needs no running server.
      - name: Check the generated API client is current
        run: |
          npm run generate-client
          git diff --exit-code frontend/src/client \
            || { echo "::error::The generated client is out of date. Run 'npm run generate-client' and commit the result."; exit 1; }

      # The pytest API suite and the Playwright browser suite, in one run.
      # MySQL comes from Test Resources and Mailpit from Testcontainers, both
      # started on demand — there is no Docker Compose file to bring up.
      - run: pyronaut test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: __pyronaut__/reports/tests/
          if-no-files-found: ignore

      # Proves the deployable builds. Native is not attempted: GraalJS is not
      # supported inside a GraalVM native image, and server-side rendering needs
      # it. See PLAN.md section 4.4.
      - run: pyronaut build --jvm --docker
