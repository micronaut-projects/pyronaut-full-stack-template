#:schema ./__pyronaut__/schemas/pyronaut-pyproject.schema.json

[project]
name = 'pyronaut-full-stack-template'
version = '0.1.0'
description = 'Full-stack Pyronaut template: MySQL, Micronaut Data JDBC, Micronaut Security, Micronaut Email and server-rendered React.'

[build-system]
requires = ['setuptools', 'wheel', 'tomli']
build-backend = 'setuptools.build_meta'

[tool.setuptools]
package-dir.'' = 'src'
packages.find.where = ['src']

[tool.pyronaut.toolchain]
type = 'jvm'

[tool.pyronaut]
repositories = ['mavenCentral']
# Pinned to match the versions the Pyronaut CLI itself is built against;
# see gradle.properties in micronaut-projects/pyronaut.
core.version = '5.2.3'
platform.version = '5.1.0'

[tool.pyronaut.control-panel]
enabled = true

[tool.pyronaut.sources]
python = 'src'
python-test = 'tests'
java = 'src-java'
java-test = 'test-java'
resources = 'config'
test-resources = 'tests-config'
# `views` holds the generated server-render bundle, `static` the generated
# hydration bundle and the assets served from /static/**.
additional-resources = ['views', 'static']
# Listed for tests too. This does not currently have the intended effect —
# the directories still do not reach the test classpath — so the test
# configuration resolves the bundle by file path instead; see
# tests-config/application-test.toml and https://github.com/micronaut-projects/pyronaut/issues/169.
# Kept here so that it starts working, and the override can be deleted, as
# soon as the bug is fixed.
additional-test-resources = ['views', 'static']

[tool.pyronaut.test]
# pytest owns the API suite; JUnit owns the Playwright end-to-end suite.
engine = 'both'

[tool.pyronaut.test-resources]
enabled = true
additional-modules = ['jdbc-mysql']
client-timeout = 180
# Keep the Test Resources server (and the MySQL container it owns) alive across
# `pyronaut dev` restarts. Without this each restart starts a fresh container,
# which costs ~12s every time. Stop it explicitly with
# `pyronaut test-resources-server stop`.
shared-server = true

[tool.pyronaut.dependencies]
runtime = [
  'io.micronaut:micronaut-http-server-netty',
  'io.micronaut.data:micronaut-data-jdbc',
  'io.micronaut.sql:micronaut-jdbc-hikari',
  'com.mysql:mysql-connector-j',
  'io.micronaut.flyway:micronaut-flyway',
  'org.flywaydb:flyway-mysql',
  'io.micronaut.serde:micronaut-serde-jackson',
  'io.micronaut.validation:micronaut-validation',
  'io.micronaut.security:micronaut-security-jwt',
  # BCrypt password hashing. No Spring context and no Spring Boot — these are
  # utility jars, pure Java with no JNI, which keeps a future native image
  # blocked only on GraalJS. See PLAN.md section 7.3.
  #
  # spring-security-crypto's POM declares no dependencies, but
  # DelegatingPasswordEncoder uses org.springframework.util.StringUtils at
  # runtime, so spring-core is required in practice and its absence only shows
  # up as a ClassNotFoundException on the first login.
  'org.springframework.security:spring-security-crypto:7.1.1',
  'org.springframework:spring-core:7.0.9',
  'io.micronaut.email:micronaut-email-javamail',
  'io.micronaut.email:micronaut-email-template',
  'org.eclipse.angus:angus-mail',
  'io.micronaut.views:micronaut-views-react:6.2.0',
  # GraalJS, pinned to the GraalVM the project builds against.
  #
  # The obvious coordinate is `org.graalvm.polyglot:js`, which is what the
  # petclinic declares — but that artifact is POM-only, and Pyronaut resolves
  # every project dependency as a jar (MavenClasspathResolver hardcodes the
  # "jar" extension), so it cannot be declared. These are the concrete jars the
  # aggregator POM pulls in. See PLAN.md section 12.
  'org.graalvm.polyglot:polyglot:25.3.4.1',
  'org.graalvm.js:js-language:25.3.4.1',
  'org.graalvm.truffle:truffle-runtime:25.3.4.1',
  'io.micronaut.pyronaut:micronaut-pyronaut-logback',
]
development-runtime = [
  'io.micronaut.controlpanel:micronaut-control-panel-datasource',
]
build = [
  'io.micronaut:micronaut-context-python',
  'io.micronaut:micronaut-inject-python',
  'io.micronaut.data:micronaut-data-processor',
  'io.micronaut.serde:micronaut-serde-processor',
  'io.micronaut.validation:micronaut-validation-processor',
  'io.micronaut.security:micronaut-security-annotations',
]
test = [
  'io.micronaut.pyronaut:micronaut-pyronaut-pytest',
  'io.micronaut.pyronaut:micronaut-pyronaut-requests',
  'io.micronaut.test:micronaut-test-junit5',
  'io.micronaut.testresources:micronaut-test-resources-jdbc-mysql',
  'io.micronaut.email:micronaut-email-mailpit-http-client',
  'org.testcontainers:testcontainers',
  # Playwright Java. No Micronaut BOM manages it, so the version is explicit.
  # The JUnit 5 extension (com.microsoft.playwright.junit.UsePlaywright) ships
  # inside this jar; there is no separate playwright-junit artifact.
  'com.microsoft.playwright:playwright:1.63.0',
]
